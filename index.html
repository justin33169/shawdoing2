<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shadowing</title>
<style>
:root{--bg:#f3f2ee;--card:#fff;--tx:#1b2233;--sub:#80869a;--pri:#2f8f6b;--acc:#e0673a;--nav:#1d2b49;--line:#e3e1da}
@media(prefers-color-scheme:dark){:root{--bg:#12151d;--card:#1c212c;--tx:#eceef4;--sub:#979eb0;--nav:#0d1423;--line:#2a3040}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
.bar{background:var(--nav);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 14px}
.bar h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:#ffffff22;border:0;color:#fff;border-radius:10px;padding:8px 12px}
.pill{background:#e3ecfa;color:#27437a;border-radius:99px;padding:4px 12px;font-size:13px;white-space:nowrap}
#list{padding:14px;display:grid;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.item b{display:block;font-size:16px}.item small{color:var(--sub)}
.item{cursor:pointer}.side{display:flex;flex-direction:column;align-items:flex-end;gap:2px}.acts{display:flex}.ic{background:none;border:0;font-size:19px;padding:6px 7px;line-height:1}
.pg{height:6px;background:var(--line);border-radius:9px;margin-top:8px;overflow:hidden}.pg i{display:block;height:100%;background:var(--pri)}
.empty{color:var(--sub);text-align:center;padding:50px 20px}
.foot{display:flex;gap:8px;padding:0 14px 20px}.foot button{flex:1;background:none;border:1px solid var(--line);border-radius:10px;padding:9px;color:var(--sub);font-size:14px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--acc);color:#fff;border:0;border-radius:99px;padding:14px 22px;font-weight:700;box-shadow:0 6px 18px #0003}
#play{display:none;height:100%;flex-direction:column}
.vid{aspect-ratio:16/9;background:#000;width:100%}.vid iframe{width:100%;height:100%}
.tools{display:flex;gap:7px;padding:10px 12px;overflow-x:auto;flex:none}
.tools button{flex:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14px}
.tools button.on{background:var(--pri);border-color:var(--pri);color:#fff}
#lines{flex:1;overflow-y:auto;padding:0 12px 12px;display:grid;gap:8px;align-content:start}
.ln{background:var(--card);border:1px solid transparent;border-radius:12px;padding:13px 14px;text-align:left;width:100%}
.ln.act{border-color:var(--pri);box-shadow:inset 4px 0 0 var(--pri)}
.ln .en{font-size:19px;font-weight:600;line-height:1.4}.ln .ko{color:var(--sub);font-size:14px;margin-top:4px;display:none}
.ln .t{color:var(--sub);font-size:12px}
body.tr .ko{display:block}
body.hide .ln:not(.show) .en{filter:blur(7px);user-select:none}
.ctl{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--bg);flex:none}
.ctl button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 0;font-size:17px}
.ctl button.rec{color:#d33}.ctl button.rec.on{background:#d33;color:#fff}
.done{margin:0 12px 12px;background:var(--acc);color:#fff;border:0;border-radius:14px;padding:15px;font-weight:700;flex:none}
.done.ok{background:var(--pri)}
dialog{border:0;border-radius:16px;width:min(560px,94vw);background:var(--card);color:var(--tx);padding:18px}
dialog::backdrop{background:#0008}
dialog input,dialog textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);margin:4px 0 10px}
dialog textarea{height:200px;font-size:14px}
dialog{max-height:92vh;overflow:auto}dialog select{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);margin:4px 0 10px}dialog label{display:block;font-size:13px;color:var(--sub)}dialog input[type=file]{padding:8px;font-size:13px}.pf{position:absolute;right:8px;top:8px;z-index:2}
dialog p{font-size:13px;color:var(--sub);margin:0 0 10px}
.row{display:flex;gap:8px;justify-content:flex-end}.row button{padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card)}.row .go{background:var(--pri);border-color:var(--pri);color:#fff}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
</style>
</head>
<body>
<section id="home">
  <div class="bar"><h1>Shadowing Gym</h1></div>
  <div id="list"></div>
  <div class="foot"><button id="exp">백업 저장</button><button id="imp">백업 불러오기</button><button id="pub">공용 목록 저장</button></div>
  <button class="fab" id="add">+ 영상 추가</button>
  <input type="file" id="file" accept=".json" hidden>
</section>

<section id="play">
  <div class="bar"><button class="ib" id="back">‹</button><h1 id="ttl"></h1><span class="pill" id="cnt"></span></div>
  <div class="vid"><div id="yt"></div></div>
  <div class="tools">
    <button id="bOne">▶ 한줄</button>
    <button id="bHide">🙈 영어가리기</button>
    <button id="bTr">번역</button>
    <button id="bLoop">🔁 구간반복</button>
    <button id="bSpd">속도 1x</button>
    </div>
  <div id="lines"></div>
  <div class="ctl">
    <button id="pv">⏮</button><button id="pp">▶</button><button id="nx">⏭</button><button id="rec" class="rec">🎤 녹음</button>
  </div>
  <button class="done" id="done">✓ 오늘 복습 완료</button>
</section>

<dialog id="dlg">
  <b id="dTitle">영상 추가</b>
  <select id="fType"><option value="yt">YouTube 링크</option><option value="url">영상 주소 (mp4 등 직접 재생 링크)</option><option value="file">내 폰의 영상 파일</option></select>
  <input id="fUrl" placeholder="YouTube 링크">
  <input id="fTitle" placeholder="제목">
  <label>영어 자막 파일 불러오기 (SRT/VTT, 선택)</label><input type="file" id="fSrtEn" accept=".srt,.vtt,.txt">
  <label>한글 자막 파일 불러오기 (SRT/VTT, 선택)</label><input type="file" id="fSrtKo" accept=".srt,.vtt,.txt">
  <textarea id="fTxt" placeholder="스크립트 붙여넣기&#10;0:03 I'm actually gonna finish this | 나 이거 진짜 다 먹을래&#10;0:06 but I'll stop, my last one."></textarea>
  <p>YouTube 설명란 → “스크립트 표시” → 복사해서 붙여넣으세요. 번역은 줄 끝에 “ | 번역” 으로 추가할 수 있어요.</p>
  <div class="row"><button id="cancel">취소</button><button class="go" id="save">저장</button></div>
</dialog>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
let D;try{D=JSON.parse(localStorage.getItem('sg')||'')}catch(e){}
if(!D||!Array.isArray(D.v))D={v:[]};
if(!Array.isArray(D.hide))D.hide=[];
const save=()=>{try{localStorage.setItem('sg',JSON.stringify(D))}catch(e){toast('저장 실패')}};
const today=()=>new Date().toLocaleDateString('sv');
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1600)};
const ago=d=>{if(!d)return'복습 전';const n=Math.round((new Date(today())-new Date(d))/864e5);return n<=0?'오늘':n==1?'어제':n+'일 전'};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 목록 ---------- */
function renderList(){
  const el=$('#list');
  if(!D.v.length){el.innerHTML='<div class="empty">아직 영상이 없어요.<br>“+ 영상 추가”로 첫 쉐도잉을 시작해 보세요.</div>';return}
  el.innerHTML=D.v.map((v,i)=>{const p=Math.round(100*(v.seen||[]).length/v.L.length);
    return `<div class="item" data-i="${i}"><div style="flex:1;min-width:0"><b>${esc(v.title)}</b><small>${v.L.length}문장 · ${v.n||0}회 복습${v.shared?' · 공용':''}</small><div class="pg"><i style="width:${p}%"></i></div></div><div class="side"><span class="pill">${ago(v.last)}</span><div class="acts"><button class="ic" data-e="${i}" aria-label="수정">✏️</button><button class="ic" data-d="${i}" aria-label="삭제">🗑️</button></div></div></div>`}).join('');
  el.querySelectorAll('.item').forEach(b=>b.onclick=()=>openVideo(+b.dataset.i));
  el.querySelectorAll('[data-e]').forEach(b=>b.onclick=e=>{e.stopPropagation();openForm(+b.dataset.e)});
  el.querySelectorAll('[data-d]').forEach(b=>b.onclick=e=>{e.stopPropagation();delVideo(+b.dataset.d)});
}

/* ---------- 스크립트 파싱 ---------- */
function parse(txt){
  const out=[],T=/^\[?(?:(\d+):)?(\d+):(\d{2})\]?$/,TL=/^\[?(?:(\d+):)?(\d+):(\d{2})\]?\s+(.+)$/;
  const sec=m=>(+m[1]||0)*3600+ +m[2]*60+ +m[3];
  let pend=null;
  for(const raw of txt.split('\n')){
    const s=raw.trim();if(!s)continue;let m;
    if(m=s.match(T)){pend=sec(m);continue}
    let t,body;
    if(m=s.match(TL)){t=sec(m);body=m[4]}else if(pend!==null){t=pend;body=s}else continue;
    pend=null;const [en,ko]=body.split(/\s\|\s/);
    out.push({t,en:en.trim(),ko:(ko||'').trim()});
  }
  return out.sort((a,b)=>a.t-b.t);
}
let editI=-1,srtEn=null,srtKo=null;
const PH={yt:'YouTube 링크',url:'https://… .mp4 (직접 재생되는 영상 주소)',file:''};
function typeUI(){const t=$('#fType').value;$('#fUrl').style.display=t==='file'?'none':'';$('#fUrl').placeholder=PH[t]}
$('#fType').onchange=typeUI;
function openForm(i){
  editI=i;const v=D.v[i];srtEn=srtKo=null;$('#fSrtEn').value='';$('#fSrtKo').value='';
  $('#dTitle').textContent=v?'영상 수정':'영상 추가';
  $('#fType').value=v?(v.type||'yt'):'yt';
  $('#fUrl').value=v?((v.type||'yt')==='url'?v.src:(v.type==='file'?'':'https://youtu.be/'+v.id)):'';
  $('#fTitle').value=v?v.title:'';
  $('#fTxt').value=v?v.L.map(l=>fmt(l.t)+' '+l.en+(l.ko?' | '+l.ko:'')).join('\n'):'';
  typeUI();$('#dlg').showModal();
}
function parseSrt(txt){
  const out=[];
  txt.replace(/\r/g,'').split(/\n\s*\n/).forEach(b=>{
    const ls=b.split('\n'),k=ls.findIndex(l=>l.includes('-->'));if(k<0)return;
    const m=ls[k].match(/(?:(\d+):)?(\d+):(\d{2})[,.](\d{1,3})/);if(!m)return;
    const t=(+m[1]||0)*3600+ +m[2]*60+ +m[3]+ +('0.'+m[4]);
    const x=ls.slice(k+1).join(' ').replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
    if(x)out.push({t,txt:x});
  });
  return out;
}
function mergeSrt(){
  if(!srtEn)return;
  $('#fTxt').value=srtEn.map(e=>{
    let ko='';
    if(srtKo){let best=null,bd=2;srtKo.forEach(k=>{const d=Math.abs(k.t-e.t);if(d<bd){bd=d;best=k}});if(best)ko=best.txt}
    return fmt(e.t)+' '+e.txt+(ko?' | '+ko:'');
  }).join('\n');
}
$('#fSrtEn').onchange=async e=>{const f=e.target.files[0];if(!f)return;srtEn=parseSrt(await f.text());mergeSrt();toast(srtEn.length?srtEn.length+'문장을 불러왔어요':'자막을 읽지 못했어요')};
$('#fSrtKo').onchange=async e=>{const f=e.target.files[0];if(!f)return;srtKo=parseSrt(await f.text());if(!srtEn)toast('영어 자막을 먼저 불러와 주세요');else{mergeSrt();toast('번역을 붙였어요')}};
function delVideo(i){
  const v=D.v[i];if(!v)return;
  if(!confirm('“'+v.title+'” 을(를) 삭제할까요?'+(v.shared?'\n(이 폰에서만 지워져요. 모두에게서 지우려면 공용 목록을 다시 올려야 해요)':'')))return;
  if(v.shared&&!D.hide.includes(v.id))D.hide.push(v.id);
  D.v.splice(i,1);save();renderList();toast('삭제했어요');
}
$('#add').onclick=()=>openForm(-1);
$('#cancel').onclick=()=>{$('#dlg').close();editI=-1};
$('#save').onclick=()=>{
  const type=$('#fType').value,url=$('#fUrl').value.trim(),L=parse($('#fTxt').value);
  const title=$('#fTitle').value.trim()||'제목 없음';
  let id,src;
  if(type==='yt'){id=(url.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/)||[])[1];if(!id)return toast('유튜브 링크를 확인해 주세요')}
  else if(type==='url'){if(!/^https:\/\//i.test(url))return toast('https:// 로 시작하는 영상 주소를 넣어 주세요');id=src=url}
  else{id='file:'+title}
  if(!L.length)return toast('스크립트에서 문장을 찾지 못했어요');
  if(editI>=0){
    const v=D.v[editI];
    if(v.shared&&v.id!==id&&!D.hide.includes(v.id))D.hide.push(v.id);
    Object.assign(v,{id,title,L,type,src});v.seen=(v.seen||[]).filter(k=>k<L.length);v.edited=true;
  }else D.v.unshift({id,title,L,type,src,n:0,seen:[]});
  D.hide=D.hide.filter(h=>h!==id);
  save();renderList();$('#dlg').close();editI=-1;
};

/* ---------- 플레이어 ---------- */
let P=null,cur=null,sel=0,loop=false,one=false,spd=1,tick=null,apiReady=false,q=[];
const SPD=[.5,.75,1,1.25];
const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);
window.onYouTubeIframeAPIReady=()=>{apiReady=true;q.forEach(f=>f());q=[]};

function openVideo(i){
  cur=D.v[i];sel=0;$('#home').style.display='none';$('#play').style.display='flex';
  $('#ttl').textContent=cur.title;updCount();renderLines();syncDone();
  clearInterval(tick);
  if(P&&P.destroy){try{P.destroy()}catch(e){}}
  P=null;const box=document.querySelector('.vid');
  if(cur.type==='url'||cur.type==='file'){
    box.style.position='relative';
    box.innerHTML='<video id="vd" playsinline controls style="width:100%;height:100%;background:#000"></video>'+(cur.type==='file'?'<button class="ib pf" id="pf">📁 파일 선택</button>':'');
    const vd=$('#vd');
    vd.onplay=()=>$('#pp').textContent='⏸';vd.onpause=()=>$('#pp').textContent='▶';
    vd.onerror=()=>toast('재생할 수 없어요. 영상 파일(mp4) 주소인지 확인해 주세요');
    if(cur.type==='url')vd.src=cur.src;
    else{
      const pick=()=>{const f=document.createElement('input');f.type='file';f.accept='video/*,audio/*';f.onchange=()=>{if(f.files[0])vd.src=URL.createObjectURL(f.files[0])};f.click()};
      $('#pf').onclick=pick;pick();
    }
    P={getCurrentTime:()=>vd.currentTime,seekTo:t=>{vd.currentTime=t},playVideo:()=>vd.play(),pauseVideo:()=>vd.pause(),getPlayerState:()=>vd.paused?2:1,getDuration:()=>vd.duration||1e9,setPlaybackRate:r=>{vd.playbackRate=r}};
    vd.playbackRate=spd;
  }else{
    box.style.position='';box.innerHTML='<div id="yt"></div>';
    const make=()=>{P=new YT.Player('yt',{videoId:cur.id,playerVars:{playsinline:1,rel:0},events:{onStateChange:e=>{$('#pp').textContent=e.data==1?'⏸':'▶'}}})};
    apiReady?make():q.push(make);
  }
  tick=setInterval(step,120);
}
function updCount(){$('#cnt').textContent=ago(cur.last)}
function renderLines(){
  $('#lines').innerHTML=cur.L.map((l,i)=>`<button class="ln" data-i="${i}"><span class="t">${fmt(l.t)}</span><div class="en">${esc(l.en)}</div><div class="ko">${esc(l.ko||'(번역 없음)')}</div></button>`).join('');
  $('#lines').querySelectorAll('.ln').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i===sel&&(loop||one))b.classList.toggle('show');go(i)});
  mark();
}
const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
function mark(){
  document.querySelectorAll('.ln').forEach((b,i)=>b.classList.toggle('act',i===sel));
  const a=document.querySelector('.ln.act');if(a)a.scrollIntoView({block:'nearest',behavior:'smooth'});
  cur.seen=cur.seen||[];if(!cur.seen.includes(sel)){cur.seen.push(sel);save()}
}
function go(i){
  i=Math.max(0,Math.min(cur.L.length-1,i));sel=i;mark();
  if(P&&P.seekTo){P.seekTo(cur.L[i].t,true);P.playVideo()}
}
function end(i){return cur.L[i+1]?cur.L[i+1].t:(P.getDuration?P.getDuration():1e9)}
function step(){
  if(!P||!P.getCurrentTime||!cur)return;
  const t=P.getCurrentTime();
  if(!loop&&!one){let a=0;for(let i=0;i<cur.L.length;i++){if(cur.L[i].t<=t+.15)a=i;else break}
    if(a!==sel){sel=a;mark()}return}
  if(t>=end(sel)-.1){ if(loop)P.seekTo(cur.L[sel].t,true); else P.pauseVideo(); }
}
$('#pv').onclick=()=>go(sel-1);
$('#nx').onclick=()=>go(sel+1);
$('#pp').onclick=()=>{if(!P)return;P.getPlayerState()==1?P.pauseVideo():P.playVideo()};
const tg=(id,cls,f)=>{$(id).onclick=()=>{const on=f();$(id).classList.toggle('on',on)}};
tg('#bOne',0,()=>(one=!one));
tg('#bLoop',0,()=>(loop=!loop));
tg('#bHide',0,()=>{const on=document.body.classList.toggle('hide');if(!on)document.querySelectorAll('.show').forEach(e=>e.classList.remove('show'));return on});
tg('#bTr',0,()=>document.body.classList.toggle('tr'));
$('#bSpd').onclick=()=>{spd=SPD[(SPD.indexOf(spd)+1)%SPD.length];if(P)P.setPlaybackRate(spd);$('#bSpd').textContent='속도 '+spd+'x'};
$('#back').onclick=()=>{clearInterval(tick);if(P&&P.pauseVideo)P.pauseVideo();$('#play').style.display='none';$('#home').style.display='block';renderList()};

/* ---------- 오늘 복습 완료 ---------- */
function syncDone(){const ok=cur.last===today();$('#done').classList.toggle('ok',ok);$('#done').textContent=ok?`✓ 오늘 완료 (${cur.n}회)`:'✓ 오늘 복습 완료'}
$('#done').onclick=()=>{if(cur.last!==today()){cur.n=(cur.n||0)+1;cur.last=today();save();toast(cur.n+'회 복습 완료!')}else toast('오늘은 이미 완료했어요');syncDone();updCount()};

/* ---------- 녹음 ---------- */
let mr=null,chunks=[];
$('#rec').onclick=async()=>{
  const b=$('#rec');
  if(mr&&mr.state==='recording'){mr.stop();return}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    mr=new MediaRecorder(st);chunks=[];
    mr.ondataavailable=e=>chunks.push(e.data);
    mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());b.classList.remove('on');b.textContent='🎤 녹음';
      const a=new Audio(URL.createObjectURL(new Blob(chunks,{type:mr.mimeType})));a.play()};
    if(P&&P.pauseVideo)P.pauseVideo();
    mr.start();b.classList.add('on');b.textContent='■ 정지 (재생됨)';
  }catch(e){toast('마이크 권한을 허용해 주세요')}
};

/* ---------- 백업 ---------- */
$('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='shadowing-backup.json';a.click()};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(Array.isArray(j.v)){D=j;save();renderList();toast('불러왔어요')}}catch(x){toast('파일을 읽지 못했어요')}};

/* ---------- 공용 목록 ---------- */
$('#pub').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({v:D.v.map(v=>({id:v.id,title:v.title,L:v.L,type:v.type,src:v.src}))})],{type:'application/json'}));a.download='library.json';a.click();toast('library.json을 GitHub에 올려 주세요')};
async function syncShared(){
  try{
    const r=await fetch('library.json?'+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const j=await r.json();if(!j||!Array.isArray(j.v))return;
    let add=0;
    D.v=D.v.filter(v=>!v.shared||j.v.some(x=>x.id===v.id));
    j.v.forEach(x=>{
      if(!x.id||!Array.isArray(x.L)||D.hide.includes(x.id))return;
      const m=D.v.find(v=>v.id===x.id);
      if(m){m.shared=true;if(!m.edited){m.title=x.title;m.L=x.L;m.type=x.type;m.src=x.src}}
      else{D.v.push({id:x.id,title:x.title,L:x.L,type:x.type,src:x.src,n:0,seen:[],shared:true});add++}
    });
    save();renderList();if(add)toast('공용 영상 '+add+'개를 가져왔어요');
  }catch(e){}
}
renderList();syncShared();
</script>
</body>
</html>
